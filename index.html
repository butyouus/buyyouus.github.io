<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>GT轨头电竞 | 代练服务（新店开业多多支持）</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 30%, #16213e 60%, #0f3460 100%);
      background-attachment: fixed;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      top: -150px;
      right: -150px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 255, 255, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: floatBubble 8s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 0, 128, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: floatBubble 10s ease-in-out infinite reverse;
    }

    @keyframes floatBubble {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-15px, 15px) scale(0.95); }
    }

    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .main-container {
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      flex: 1;
    }

    /* 头部 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
      background: rgba(10, 10, 20, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 16px 28px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 255, 0.15);
      border: 1px solid rgba(0, 255, 255, 0.1);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      width: 55px;
      height: 55px;
      border-radius: 14px;
      object-fit: cover;
      border: 2px solid rgba(0, 255, 255, 0.5);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
      transition: all 0.3s;
      background: #1a1a2e;
    }

    .logo-img:hover {
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.6);
      transform: scale(1.08);
      border-color: #00ffff;
    }

    .logo-text {
      font-weight: 800;
      font-size: 1.6rem;
      background: linear-gradient(135deg, #00ffff, #ff0080);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50px;
      padding: 10px 20px;
      border: 1px solid rgba(0, 255, 255, 0.2);
      transition: all 0.3s;
    }

    .search-box:focus-within {
      border-color: rgba(0, 255, 255, 0.6);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .search-box input {
      border: none;
      outline: none;
      font-size: 0.95rem;
      width: 180px;
      background: transparent;
      color: #e0e0e0;
    }

    .search-box input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .search-box button {
      background: none;
      border: none;
      color: #00ffff;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
    }

    .cart-btn {
      position: relative;
      background: linear-gradient(135deg, #ff0080, #ff6b6b);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 25px rgba(255, 0, 128, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .cart-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(255, 0, 128, 0.6);
    }

    .cart-count {
      background: white;
      color: #ff0080;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* 分类标签 */
    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    .category-tab {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 255, 0.15);
      padding: 10px 22px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      color: #aaa;
      font-size: 0.9rem;
    }

    .category-tab:hover {
      background: rgba(0, 255, 255, 0.1);
      border-color: rgba(0, 255, 255, 0.4);
      color: #00ffff;
      transform: translateY(-2px);
    }

    .category-tab.active {
      background: rgba(0, 255, 255, 0.15);
      border-color: #00ffff;
      color: #00ffff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }

    /* 商品网格 */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 30px;
    }

    .product-card {
      background: rgba(20, 20, 40, 0.8);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 255, 255, 0.1);
      cursor: pointer;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 255, 255, 0.15);
      border-color: rgba(0, 255, 255, 0.4);
    }

    .product-image {
      width: 100%;
      height: 200px;
      position: relative;
      overflow: hidden;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.1);
    }

    .product-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #ff0080, #ff6b6b);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      z-index: 2;
      box-shadow: 0 5px 15px rgba(255, 0, 128, 0.4);
    }

    .product-info {
      padding: 18px 16px;
    }

    .product-name {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: #e0e0e0;
    }

    .product-desc {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .product-price {
      font-weight: 800;
      font-size: 1.3rem;
      color: #00ffff;
    }

    .product-price .original {
      text-decoration: line-through;
      color: #555;
      font-size: 0.8rem;
      font-weight: 500;
      margin-left: 6px;
    }

    .add-to-cart {
      background: linear-gradient(135deg, #ff0080, #ff6b6b);
      color: white;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 20px rgba(255, 0, 128, 0.4);
    }

    .add-to-cart:hover {
      transform: scale(1.15);
      box-shadow: 0 8px 30px rgba(255, 0, 128, 0.6);
    }

    .add-to-cart.added {
      background: #00ff88;
      animation: popIn 0.4s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* 购物车侧边栏 */
    .cart-sidebar {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      max-width: 90vw;
      height: 100vh;
      background: rgba(10, 10, 30, 0.98);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 1000;
      transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -10px 0 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(0, 255, 255, 0.15);
    }

    .cart-sidebar.open {
      right: 0;
    }

    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .cart-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .cart-header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(0, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h3 {
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e0e0e0;
    }

    .close-cart {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
      transition: 0.2s;
    }

    .close-cart:hover {
      color: #ff0080;
      transform: rotate(90deg);
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      animation: slideIn 0.3s ease;
      color: #ccc;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .cart-item-img {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      object-fit: cover;
      background: #1a1a2e;
      flex-shrink: 0;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: 600;
      font-size: 0.9rem;
      color: #e0e0e0;
    }

    .cart-item-price {
      color: #00ffff;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .cart-item-quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(0, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      color: #00ffff;
    }

    .qty-btn:hover {
      border-color: #00ffff;
      background: rgba(0, 255, 255, 0.1);
    }

    .cart-footer {
      padding: 20px 24px;
      border-top: 1px solid rgba(0, 255, 255, 0.1);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #e0e0e0;
    }

    .checkout-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00c853, #00e676);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 25px rgba(0, 200, 83, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .checkout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(0, 200, 83, 0.6);
    }

    .empty-cart {
      text-align: center;
      padding: 60px 20px;
      color: #555;
      font-size: 1.1rem;
    }

    .empty-cart i {
      font-size: 4rem;
      display: block;
      margin-bottom: 16px;
    }

    /* 二维码弹窗 */
    .qr-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .qr-modal.show {
      opacity: 1;
      pointer-events: all;
    }

    .qr-content {
      background: rgba(20, 20, 40, 0.98);
      border: 2px solid rgba(0, 255, 255, 0.3);
      border-radius: 24px;
      padding: 30px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 60px rgba(0, 255, 255, 0.1);
      animation: modalIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.8) translateY(30px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .qr-title {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00ffff, #00e676);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .qr-subtitle {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .qr-subtitle .highlight {
      color: #00e676;
      font-weight: 700;
    }

    .qr-image-wrapper {
      width: 240px;
      height: 240px;
      margin: 0 auto 20px;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid rgba(0, 255, 255, 0.3);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .qr-info-list {
      text-align: left;
      margin: 0 auto 20px;
      display: inline-block;
    }

    .qr-info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ccc;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .qr-info-item i {
      color: #00e676;
      width: 20px;
      text-align: center;
    }

    .qr-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .qr-btn-close {
      background: rgba(255, 255, 255, 0.1);
      color: #aaa;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      font-size: 0.9rem;
    }

    .qr-btn-close:hover {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .qr-btn-confirm {
      background: linear-gradient(135deg, #07c160, #00e676);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      font-size: 0.9rem;
      box-shadow: 0 5px 20px rgba(7, 193, 96, 0.4);
    }

    .qr-btn-confirm:hover {
      box-shadow: 0 8px 30px rgba(7, 193, 96, 0.6);
      transform: translateY(-2px);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1a1a2e;
      color: #00ffff;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 600;
      z-index: 3000;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 255, 0.2);
      border: 1px solid rgba(0, 255, 255, 0.3);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* 底部版权 */
    .footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      position: relative;
      z-index: 1;
    }

    .footer-content {
      display: inline-block;
      background: rgba(10, 10, 20, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 50px;
      padding: 12px 30px;
      color: #888;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .footer-content strong {
      background: linear-gradient(135deg, #00ffff, #ff0080);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
    }

    @media (max-width: 768px) {
      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
      }
      .header {
        padding: 14px 16px;
      }
      .search-box input {
        width: 100px;
      }
      .logo-text {
        font-size: 1.2rem;
      }
      .qr-content {
        padding: 20px;
      }
      .qr-image-wrapper {
        width: 200px;
        height: 200px;
      }
      .product-image {
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="main-container">
    <!-- 头部 -->
    <header class="header">
      <div class="logo">
        <img 
          src="https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true"
          alt="GT轨头电竞Logo" 
          class="logo-img"
          onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%231a1a2e%22 width=%22100%22 height=%22100%22 rx=%2212%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%2300ffff%22 font-size=%2236%22 font-weight=%22bold%22>GT</text></svg>'"
        >
        <span class="logo-text">GT轨头电竞</span>
      </div>
      <div class="header-actions">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索服务...">
          <button><i class="fas fa-search"></i></button>
        </div>
        <button class="cart-btn" id="cartToggle">
          <i class="fas fa-shopping-bag"></i> 购物车
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </header>

    <!-- 分类标签 -->
    <div class="category-tabs" id="categoryTabs">
      <div class="category-tab active" data-category="all">🔥 全部</div>
      <div class="category-tab" data-category="baodi">💰 保底套餐</div>
      <div class="category-tab" data-category="wudi">⚔️ 无敌套餐</div>
      <div class="category-tab" data-category="paodao">🔪 跑刀服务</div>
      <div class="category-tab" data-category="zhiding">🎯 指定服务</div>
      <div class="category-tab" data-category="other">🎁 其他</div>
    </div>

    <!-- 商品网格 -->
    <div class="products-grid" id="productsGrid"></div>
  </div>

  <!-- 底部版权 -->
  <footer class="footer">
    <div class="footer-content">
      © 2024 <strong>GT轨头电竞</strong> 版权所有 · 此乃归GT轨头电竞所有
    </div>
  </footer>

  <!-- 购物车覆盖层 -->
  <div class="cart-overlay" id="cartOverlay"></div>

  <!-- 购物车侧边栏 -->
  <div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h3><i class="fas fa-shopping-bag"></i> 我的购物车</h3>
      <button class="close-cart" id="closeCart"><i class="fas fa-times"></i></button>
    </div>
    <div class="cart-items" id="cartItems">
      <div class="empty-cart">
        <i class="fas fa-shopping-cart"></i>
        <p>购物车空空如也~</p>
      </div>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>合计</span>
        <span id="cartTotal">¥0.00</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn">
        <i class="fab fa-weixin"></i> 结算 · 加群购买
      </button>
    </div>
  </div>

  <!-- 加群二维码弹窗 -->
  <div class="qr-modal" id="qrModal">
    <div class="qr-content">
      <div class="qr-title">
        <i class="fab fa-weixin"></i> 扫码加入GT电竞群
      </div>
      <div class="qr-subtitle">
        添加群主微信 <span class="highlight">GTguitui</span> 进行购买
      </div>
      
      <div class="qr-image-wrapper">
        <img 
          src="https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true"
          alt="GT轨头电竞微信群二维码"
          onerror="this.src='https://github.com/butyouus/buyyouus.github.io/blob/main/微信图片_20260730143529_11_3.jpg?raw=true>GT轨头电竞</text></svg>'"
        >
      </div>

      <div class="qr-info-list">
        <div class="qr-info-item">
          <i class="fas fa-check-circle"></i>
          <span>打开微信扫一扫</span>
        </div>
        <div class="qr-info-item">
          <i class="fas fa-check-circle"></i>
          <span>添加群主为好友</span>
        </div>
        <div class="qr-info-item">
          <i class="fas fa-check-circle"></i>
          <span>发送想要的服务截图</span>
        </div>
        <div class="qr-info-item">
          <i class="fas fa-check-circle"></i>
          <span>群主确认订单后付款发货</span>
        </div>
      </div>

      <div class="qr-buttons">
        <button class="qr-btn-close" id="qrClose">关闭</button>
        <button class="qr-btn-confirm" id="qrConfirm">
          <i class="fas fa-copy"></i> 复制微信号
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      const products = [
        { 
          id: 1, 
          name: '保底300w', 
          category: 'baodi', 
          price: 15, 
          originalPrice: null,
          image: 'https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true',
          desc: '包老板满意放心下单，售后有保障', 
          badge: '黑奴' 
        },
        { 
          id: 2, 
          name: '保底600w', 
          category: 'baodi', 
          price: 30, 
          originalPrice: null,
          image: 'https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true',
          desc: '包老板满意放心下单，售后有保障', 
          badge: '黑奴' 
        },
        { 
          id: 3, 
          name: '保底1000w', 
          category: 'baodi', 
          price: 45, 
          originalPrice: null,
          image: 'https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true',
          desc: '包老板满意放心下单，售后有保障', 
          badge: '黑奴' 
        },
        { 
          id: 4, 
          name: '不出油一直打', 
          category: 'wudi', 
          price: 99, 
          originalPrice: null,
          image: 'https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true',
          desc: '包老板满意放心下单，售后有保障', 
          badge: '限时' 
        },
        { 
          id: 5, 
          name: '不出6格红一直打（包卡）', 
          category: 'wudi', 
          price: 128, 
          originalPrice: null,
          image: 'https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true',
          desc: '包老板满意放心下单，售后有保障', 
          badge: '限量' 
        },
        { 
          id: 6, 
          name: '奖励打手鸡腿', 
          category: 'other', 
          price: 9, 
          originalPrice: null,
          image: 'https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true',
          desc: '包老板满意放心下单，售后有保障', 
          badge: '永久' 
        },
        { 
          id: 7, 
          name: '幸运转盘单（抽到什么打什么）', 
          category: 'other', 
          price: 66, 
          originalPrice: null,
          image: 'https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true',
          desc: '包老板满意放心下单，售后有保障', 
          badge: '爆款' 
        },
        { 
          id: 8, 
          name: '跑刀1000w', 
          category: 'paodao', 
          price: 99, 
          originalPrice: null,
          image: 'https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true',
          desc: '包老板满意放心下单，售后有保障', 
          badge: '跑刀' 
        },
        { 
          id: 9, 
          name: '跑刀5000w', 
          category: 'paodao', 
          price: 396, 
          originalPrice: null,
          image: 'https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true',
          desc: '包老板满意放心下单，售后有保障', 
          badge: '热卖' 
        },
        { 
          id: 10, 
          name: '指定魔王户', 
          category: 'zhiding', 
          price: 20, 
          originalPrice: null,
          image: 'https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true',
          desc: '包老板满意放心下单，售后有保障', 
          badge: '指定' 
        },
        { 
          id: 11, 
          name: '指定搞完户', 
          category: 'zhiding', 
          price: 10, 
          originalPrice: null,
          image: 'https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true',
          desc: '包老板满意放心下单，售后有保障', 
          badge: '指定' 
        },
        { 
          id: 12, 
          name: '指定顶尖户', 
          category: 'zhiding', 
          price: 5, 
          originalPrice: null,
          image: 'https://github.com/butyouus/butyouus.io/blob/main/webwxgetmsgimg.jpg?raw=true',
          desc: '包老板满意放心下单，售后有保障', 
          badge: '指定' 
        },
      ];

      const WECHAT_ID = 'GTguitui';
      let cart = [];
      let currentCategory = 'all';
      let searchTerm = '';

      const productsGrid = document.getElementById('productsGrid');
      const categoryTabs = document.getElementById('categoryTabs');
      const cartToggle = document.getElementById('cartToggle');
      const cartSidebar = document.getElementById('cartSidebar');
      const cartOverlay = document.getElementById('cartOverlay');
      const closeCart = document.getElementById('closeCart');
      const cartItems = document.getElementById('cartItems');
      const cartCount = document.getElementById('cartCount');
      const cartTotal = document.getElementById('cartTotal');
      const checkoutBtn = document.getElementById('checkoutBtn');
      const toast = document.getElementById('toast');
      const searchInput = document.getElementById('searchInput');
      const qrModal = document.getElementById('qrModal');
      const qrClose = document.getElementById('qrClose');
      const qrConfirm = document.getElementById('qrConfirm');

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
          toast.classList.remove('show');
        }, 2500);
      }

      function getCartTotal() {
        return cart.reduce((total, item) => {
          const product = products.find(p => p.id === item.id);
          return total + (product ? product.price * item.quantity : 0);
        }, 0);
      }

      function getCartItemCount() {
        return cart.reduce((sum, item) => sum + item.quantity, 0);
      }

      function showQRModal() {
        qrModal.classList.add('show');
        document.body.style.overflow = 'hidden';
      }

      function hideQRModal() {
        qrModal.classList.remove('show');
        document.body.style.overflow = '';
      }

      function copyWechatId() {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(WECHAT_ID).then(() => {
            showToast('✅ 已复制微信号：' + WECHAT_ID + '，去微信添加好友吧！');
          }).catch(() => fallbackCopy());
        } else {
          fallbackCopy();
        }
      }

      function fallbackCopy() {
        const textarea = document.createElement('textarea');
        textarea.value = WECHAT_ID;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast('✅ 已复制微信号：' + WECHAT_ID + '，去微信添加好友吧！');
        } catch (e) {
          showToast('⚠️ 请手动添加微信：' + WECHAT_ID);
        }
        document.body.removeChild(textarea);
      }

      // ========== 渲染商品 ==========
      function renderProducts() {
        let filtered = products;

        if (currentCategory !== 'all') {
          filtered = filtered.filter(p => p.category === currentCategory);
        }

        if (searchTerm.trim()) {
          const term = searchTerm.trim().toLowerCase();
          filtered = filtered.filter(p => 
            p.name.toLowerCase().includes(term) || 
            p.desc.toLowerCase().includes(term) ||
            p.category.includes(term)
          );
        }

        if (filtered.length === 0) {
          productsGrid.innerHTML = `
            <div style="grid-column:1/-1; text-align:center; padding:60px; color:#666;">
              <i class="fas fa-search" style="font-size:3rem; display:block; margin-bottom:16px;"></i>
              <p style="font-size:1.1rem;">没有找到相关服务~</p>
            </div>`;
          return;
        }

        productsGrid.innerHTML = filtered.map(product => {
          const inCart = cart.find(item => item.id === product.id);
          const quantity = inCart ? inCart.quantity : 0;
          return `
            <div class="product-card" data-id="${product.id}">
              ${product.badge ? `<div class="product-badge">${product.badge}</div>` : ''}
              <div class="product-image">
                <img 
                  src="${product.image}" 
                  alt="${product.name}" 
                  loading="lazy"
                  onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                >
                <div style="display:none; position:absolute; inset:0; align-items:center; justify-content:center; font-size:3rem; background:linear-gradient(135deg, #1a1a2e, #2a2a4e); color:#555;">
                  🎮
                </div>
              </div>
              <div class="product-info">
                <div class="product-name">${product.name}</div>
                <div class="product-desc">${product.desc}</div>
                <div class="product-footer">
                  <div class="product-price">
                    ¥${product.price}
                  </div>
                  <button class="add-to-cart ${quantity > 0 ? 'added' : ''}" data-id="${product.id}" title="加入购物车">
                    <i class="fas ${quantity > 0 ? 'fa-check' : 'fa-plus'}"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        document.querySelectorAll('.add-to-cart').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = parseInt(btn.dataset.id);
            addToCart(id);
            btn.classList.add('added');
            btn.innerHTML = '<i class="fas fa-check"></i>';
            setTimeout(() => {
              const item = cart.find(i => i.id === id);
              if (!item || item.quantity === 0) {
                btn.classList.remove('added');
                btn.innerHTML = '<i class="fas fa-plus"></i>';
              }
            }, 800);
          });
        });

        document.querySelectorAll('.product-card').forEach(card => {
          card.addEventListener('click', (e) => {
            if (e.target.closest('.add-to-cart')) return;
            const id = parseInt(card.dataset.id);
            const product = products.find(p => p.id === id);
            showToast(`👀 ${product.name} - ¥${product.price} | 加群购买`);
          });
        });
      }

      function addToCart(id) {
        const existing = cart.find(item => item.id === id);
        if (existing) {
          existing.quantity += 1;
        } else {
          cart.push({ id, quantity: 1 });
        }
        const product = products.find(p => p.id === id);
        showToast(`✅ 已添加: ${product.name}`);
        updateCart();
        renderProducts();
      }

      function removeFromCart(id) {
        cart = cart.filter(item => item.id !== id);
        updateCart();
        renderProducts();
      }

      function updateQuantity(id, delta) {
        const item = cart.find(i => i.id === id);
        if (!item) return;
        item.quantity += delta;
        if (item.quantity <= 0) {
          removeFromCart(id);
          return;
        }
        updateCart();
        renderProducts();
      }

      function updateCart() {
        const count = getCartItemCount();
        cartCount.textContent = count;
        cartTotal.textContent = `¥${getCartTotal().toFixed(2)}`;

        if (cart.length === 0) {
          cartItems.innerHTML = `
            <div class="empty-cart">
              <i class="fas fa-shopping-cart"></i>
              <p>购物车空空如也~</p>
            </div>`;
        } else {
          cartItems.innerHTML = cart.map(item => {
            const product = products.find(p => p.id === item.id);
            if (!product) return '';
            return `
              <div class="cart-item">
                <img 
                  src="${product.image}" 
                  alt="${product.name}" 
                  class="cart-item-img"
                  onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                >
                <div class="cart-item-img" style="display:none; align-items:center; justify-content:center; font-size:1.5rem; background:#1a1a2e;">
                  🎮
                </div>
                <div class="cart-item-info">
                  <div class="cart-item-name">${product.name}</div>
                  <div class="cart-item-price">¥${(product.price * item.quantity).toFixed(2)}</div>
                </div>
                <div class="cart-item-quantity">
                  <button class="qty-btn" data-id="${item.id}" data-delta="-1">−</button>
                  <span style="font-weight:600; min-width:20px; text-align:center; color:#e0e0e0;">${item.quantity}</span>
                  <button class="qty-btn" data-id="${item.id}" data-delta="1">+</button>
                </div>
                <button style="background:none; border:none; color:#555; cursor:pointer; font-size:1rem;" data-id="${item.id}" data-action="remove">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </div>
            `;
          }).join('');

          cartItems.querySelectorAll('.qty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const id = parseInt(btn.dataset.id);
              const delta = parseInt(btn.dataset.delta);
              updateQuantity(id, delta);
            });
          });
          cartItems.querySelectorAll('[data-action="remove"]').forEach(btn => {
            btn.addEventListener('click', () => {
              const id = parseInt(btn.dataset.id);
              removeFromCart(id);
            });
          });
        }
      }

      function toggleCart(open) {
        if (open === undefined) {
          open = !cartSidebar.classList.contains('open');
        }
        if (open) {
          cartSidebar.classList.add('open');
          cartOverlay.classList.add('show');
          document.body.style.overflow = 'hidden';
        } else {
          cartSidebar.classList.remove('open');
          cartOverlay.classList.remove('show');
          document.body.style.overflow = '';
        }
      }

      // ========== 事件监听 ==========
      cartToggle.addEventListener('click', () => toggleCart(true));
      closeCart.addEventListener('click', () => toggleCart(false));
      cartOverlay.addEventListener('click', () => toggleCart(false));

      categoryTabs.addEventListener('click', (e) => {
        const tab = e.target.closest('.category-tab');
        if (!tab) return;
        document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCategory = tab.dataset.category;
        renderProducts();
      });

      searchInput.addEventListener('input', (e) => {
        searchTerm = e.target.value;
        renderProducts();
      });

      checkoutBtn.addEventListener('click', () => {
        if (cart.length === 0) {
          showToast('🛒 购物车还是空的哦~');
          return;
        }
        const total = getCartTotal();
        showToast(`📋 订单合计 ¥${total.toFixed(2)}，请扫码加群购买`);
        showQRModal();
        toggleCart(false);
      });

      qrClose.addEventListener('click', hideQRModal);
      qrModal.addEventListener('click', (e) => {
        if (e.target === qrModal) hideQRModal();
      });
      qrConfirm.addEventListener('click', copyWechatId);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (qrModal.classList.contains('show')) hideQRModal();
          else toggleCart(false);
        }
      });

      // ========== 初始化 ==========
      updateCart();
      renderProducts();

      console.log('🎮 GT轨头电竞 - 代练服务平台已就绪！');
      console.log('💬 加群购买 | 微信号：' + WECHAT_ID);
      console.log('© 此乃归GT轨头电竞所有');
    })();
  </script>
